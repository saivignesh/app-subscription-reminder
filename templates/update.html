<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/bootstrap-5.3.8-dist/css/bootstrap.css">
    <title>Update Sub</title>
</head>
<body>
    <div class="p-5 container-md text-bg-dark col-lg-5">        
        <h2 class="text-center">Update {{sub.name}}</h2>
        <form action="" method="POST" >
            <label class="form-label" for="name"  >App Name</label>
            <input class="form-control" id="name" name="name" type="text" value="{{sub.name}}"/>
            <label class="form-label" for="amount" >Amount</label>
            <input class="form-control" id="amount" name="amount" type="number" step="any" value="{{sub.amount}}"/>
            <label class="form-label" for="type">Type</label>
            <input class="form-control" id="type" name="type" type="text" value="{{sub.subtype}}"/>
            <div class="col-6">
                <label class="form-label" for="subdate">Start Date</label>
                <input class="form-control" type="Date" name="subdate" id="subdate" value="{{sub.subdate}}"/>
                <label class="form-label" for="expdate">End Date</label>
                <input class="form-control" type="Date" name="expdate" id="expdate" value="{{sub.expdate}}"/>
            
                <label class="form-label" for="subdays">Total No. of Days</label>
                <input class="form-control" type="number" name="subdays" id="subdays" value="{{sub.subdays}}"/>
            </div><br>
            <button class="btn btn-success"type="submit">Submit</button>  
            <a class="btn btn-primary" href="{{url_for('index')}}">Go Back</a>      
        </form>    
    </div>
    
    <script src="../static/bootstrap-5.3.8-dist/js/bootstrap.bundle.js"></script>     
</body>
</html>
